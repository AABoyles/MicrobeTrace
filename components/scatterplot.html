<div class="scatterplot-plot"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Scatterplot Settings">
    <span class="bi bi-gear"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#scatterplot-export-modal" title="Export Scatterplot">
    <span class="bi bi-download"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li role="presentation" class="nav-item active">
      <a href="#scatterplot-configurations" aria-controls="scatterplot-configurations" class="nav-link active" role="tab" data-bs-toggle="tab">Scatterplot</a>
    </li>
  </ul>
  <div class="tab-content">
    <div role="tabpanel" class="tab-pane fade show active" id="scatterplot-configurations">
      <div class="form-group row" title="Should the scatterplot show Node or Link Variables?">
        <div class="col-3">Dataset</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
            <label class="btn btn-light col">
              <input type="radio" name="scatterplot-dataset" data-setting="scatterplot-showNodes" value="true" autocomplete="off"> Nodes
            </label>
            <label class="btn btn-light col active">
              <input type="radio" name="scatterplot-dataset" data-setting="scatterplot-showNodes" value="false" autocomplete="off" checked> Links
            </label>
          </div>
        </div>
      </div>
      <div class="form-group row" title="Which variable should the scatterplot be drawn from?">
        <div class="col-3"><label for="scatterplot-xVar">X Variable</label></div>
        <div class="col-9">
          <select id="scatterplot-xVar" class="form-select form-select-sm" data-setting="scatterplot-xVar"></select>
        </div>
      </div>
      <div class="form-group row" title="Which variable should the scatterplot be drawn from?">
        <div class="col-3"><label for="scatterplot-yVar">Y Variable</label></div>
        <div class="col-9">
          <select id="scatterplot-yVar" class="form-select form-select-sm" data-setting="scatterplot-yVar"></select>
        </div>
      </div>
      <div class="form-group row" title="Should the y-axis show a linear or logarithmic scale?">
        <div class="col-3">Scale</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
            <label class="btn btn-light active col">
              <input type="radio" name="scatterplot-scale" data-setting="scatterplot-logScale" value="false" autocomplete="off" checked> Linear
            </label>
            <label class="btn btn-light col">
              <input type="radio" name="scatterplot-scale" data-setting="scatterplot-logScale" value="true" autocomplete="off"> Log
            </label>
          </div>
        </div>
      </div>
      <div class="form-group row" title="What color should the scatterplot be?">
        <div class="col-3">Color</div>
        <div class="col-9"><button class="btn btn-sm btn-light w-100 launch-color-options">Color Options</button></div>
      </div>
    </div>
  </div>
</div>

<div id="scatterplot-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Scatterplot</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" class="form-select form-select-sm">
              <option selected>png</option>
              <option>jpeg</option>
              <option>webp</option>
              <option>svg</option>
            </select>
          </div>
        </div>
        <div class="form-group row mb-0">
          <div class="col-3 offset-9">
            <button class="btn btn-link btn-sm w-100 text-end export-advanced-button" type="button" data-bs-toggle="collapse" data-bs-target="#scatterplot-export-advanced" aria-expanded="false" aria-controls="scatterplot-export-advanced">Advanced</button>
          </div>
        </div>
        <div class="collapse" id="scatterplot-export-advanced" style="margin-top: 10px;">
          <div class="card card-body">
            <div class="form-group row">
              <div class="col-3">
                <label for="scatterplot-export-scale">Scale</label>
              </div>
              <div class="col-9">
                <input type="number" id="scatterplot-export-scale" name="export-scale" class="form-control form-control-sm" min="0" step="0.1" value="1">
              </div>
            </div>
            <div class="form-group row">
              <div class="col-3">Resolution</div>
              <div class="col-9 text-end export-dimensions"></div>
            </div>
            <div class="row">
              <div class="col-3">
                <label for="scatterplot-export-quality">Quality</label>
              </div>
              <div class="col-9">
                <input type="range" class="form-range" id="scatterplot-export-quality" name="export-quality" min="0" max="1.0" value="0.92" step="0.01">
              </div>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top: 10px;">
          <div class="col-3">
            <label for="scatterplot-export-opacity">Watermark Opacity</label>
          </div>
          <div class="col-9">
            <input type="range" class="form-range" id="scatterplot-export-opacity" name="export-opacity" min="0.0" max="1.0" value="0.4" step="0.01">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script>
  MT.registerView('scatterplot', (root, { settings, events }) => {
    ga('set', 'page', '/scatterplot');
    ga('set', 'title', 'Scatterplot View');
    ga('send', 'pageview');

    const $ = selector => root.querySelector(selector);
    const plot = $('.scatterplot-plot');
    const pane = $('.left-pane');
    const variables = [['scatterplot-xVar', $('#scatterplot-xVar')], ['scatterplot-yVar', $('#scatterplot-yVar')]];

    // The variable menus offer the chosen dataset's fields. A variable the
    // dataset doesn't have (or not yet chosen) becomes one of its measurements:
    // the first two, or the one by cluster.
    function showFields() {
      const nodes = settings.get('scatterplot-showNodes');
      const fields = session.data[nodes ? 'nodeFields' : 'linkFields'];
      const options = fields.map(f => `<option value="${f}">${MT.titleize(f)}</option>`).join('');
      const measures = MT.numericFields(nodes ? MT.getVisibleNodes() : MT.getVisibleLinks(), fields);
      const fallback = fields.includes('cluster') ? 'cluster' : fields[0];
      const defaults = measures.length > 1 ? measures.slice(0, 2) : [fallback, measures[0] || fields[0]];
      variables.forEach(([key, select], i) => {
        select.innerHTML = options;
        if (!fields.includes(settings.get(key))) settings.set(key, defaults[i]);
        select.value = settings.get(key);
      });
    }

    function draw() {
      const width = MT.viewWidth(root), height = root.clientHeight;
      // A view in a background tab has no size; it draws when it's shown
      if (!width || !height) return;
      const nodes = settings.get('scatterplot-showNodes');
      const xVar = settings.get('scatterplot-xVar'), yVar = settings.get('scatterplot-yVar');
      const items = nodes ? MT.getVisibleNodes() : MT.getVisibleLinks();
      const color = settings.get(nodes ? 'node-color' : 'link-color');
      // Faint gridlines, so the points stand out
      const grid = { gridcolor: MT.gridColor(settings), zerolinecolor: MT.gridColor(settings, 0.4) };
      Plotly.react(plot, [{
        x: items.map(d => d[xVar]),
        y: items.map(d => d[yVar]),
        type: 'scatter',
        mode: 'markers',
        // An outline in a darker shade, so light colors stand out from the page
        marker: { color, size: 8, line: { color: d3.color(color).darker(1.5) + '', width: 1 } }
      }], {
        width, height,
        xaxis: { title: { text: MT.titleize(xVar) }, automargin: true, ...grid },
        yaxis: { title: { text: MT.titleize(yVar) }, automargin: true, ...grid, type: settings.get('scatterplot-logScale') ? 'log' : '-' },
        ...MT.plotLayout(root, settings)
      }, {
        displaylogo: false,
        displayModeBar: false
      });
    }

    MT.paneToggle($('.settings-toggle'), pane, false, { beside: $('.scatterplot-plot'), resize: draw });
    MT.plotExport(root, plot, settings);

    // Older sessions may store the dataset as something other than a boolean
    settings.set('scatterplot-showNodes', !!settings.get('scatterplot-showNodes'));
    showFields();
    const stop = [
      MTBind(pane, settings),
      settings.subscribe('scatterplot-showNodes', showFields),
      settings.subscribe(['scatterplot-showNodes', 'scatterplot-xVar', 'scatterplot-yVar', 'scatterplot-logScale'], draw),
      ...['node-color-change', 'link-color-change', 'background-color-change', 'node-visibility', 'link-visibility']
        .map(type => events.on(type, draw))
    ];
    draw();

    return {
      resize: draw,
      destroy() {
        stop.forEach(fn => fn());
        Plotly.purge(plot);
      }
    };
  });
</script>
