<svg class="bubbles">
  <text class="x-label" y="20" text-anchor="middle"></text>
  <text class="y-label" text-anchor="middle"></text>
</svg>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Bubbles Settings">
    <span class="oi oi-cog"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#bubbles-export-modal" title="Export Bubbles">
    <span class="oi oi-data-transfer-download"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item">
      <a href="#bubble-node-configurations" class="nav-link active" aria-controls="bubble-node-configurations" role="tab" data-bs-toggle="tab">Nodes</a>
    </li>
    <li class="nav-item">
      <a href="#bubble-physics-configurations" class="nav-link" aria-controls="bubble-physics-configurations" role="tab" data-bs-toggle="tab">Physics</a>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="bubble-node-configurations" role="tabpanel">
      <div class="form-group row" title="How big should the bubbles be?">
        <div class="col-3"><label for="bubble-size">Size</label></div>
        <div class="col-9"><input type="range" id="bubble-size" class="form-range" data-setting="bubble-size" min="1" value="5" max="15" step="0.1"></div>
      </div>
      <div class="form-group row">
        <div class="col-3">Color</div>
        <div class="col-9"><button class="btn btn-sm btn-light w-100 launch-color-options">Color Options</button></div>
      </div>
    </div>
    <div class="tab-pane fade" id="bubble-physics-configurations" role="tabpanel">
      <div class="form-group row" title="What variable should be used for the Bubbles' X axis?">
        <div class="col-3"><label for="bubble-x">X</label></div>
        <div class="col-9"><select id="bubble-x" class="form-select form-select-sm nodeVariables" data-setting="bubble-x"></select></div>
      </div>
      <div class="form-group row" title="What variable should be used for the Bubbles' Y axis?">
        <div class="col-3"><label for="bubble-y">Y</label></div>
        <div class="col-9"><select id="bubble-y" class="form-select form-select-sm nodeVariables" data-setting="bubble-y"></select></div>
      </div>
      <div class="form-group row" title="How much should the bubbles repulse each other?">
        <div class="col-3"><label for="bubble-charge">Charge</label></div>
        <div class="col-9"><input type="range" id="bubble-charge" class="form-range" data-setting="bubble-charge" min="0" value="1.5" max="10" step="0.1"></div>
      </div>
    </div>
  </div>
</div>

<div id="bubbles-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Bubbles</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" class="form-select form-select-sm">
              <option selected>png</option>
              <option>jpeg</option>
              <option>webp</option>
              <option>svg</option>
            </select>
          </div>
        </div>
        <div class="form-group row mb-0">
          <div class="col-3 offset-9">
            <button class="btn btn-primary btn-sm w-100 export-advanced-button" type="button" data-bs-toggle="collapse" data-bs-target="#bubbles-export-advanced" aria-expanded="false" aria-controls="bubbles-export-advanced">Advanced</button>
          </div>
        </div>
        <div class="collapse" id="bubbles-export-advanced" style="margin-top: 10px;">
          <div class="card card-body">
            <div class="form-group row">
              <div class="col-3">
                <label for="bubbles-export-scale">Scale</label>
              </div>
              <div class="col-9">
                <input type="number" id="bubbles-export-scale" name="export-scale" class="form-control form-control-sm" min="0" step="0.1" value="1">
              </div>
            </div>
            <div class="form-group row">
              <div class="col-3">Resolution</div>
              <div class="col-9 text-end export-dimensions"></div>
            </div>
            <div class="row">
              <div class="col-3">
                <label for="bubbles-export-quality">Quality</label>
              </div>
              <div class="col-9">
                <input type="range" class="form-range" id="bubbles-export-quality" name="export-quality" min="0" max="1.0" value="0.92" step="0.01">
              </div>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top: 10px;">
          <div class="col-3">
            <label for="bubbles-export-opacity">Watermark Opacity</label>
          </div>
          <div class="col-9">
            <input type="range" id="bubbles-export-opacity" name="export-opacity" min="0.0" max="1.0" value="0.4" step="0.01">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-error" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script>
  MT.registerView('bubbles', (root, { settings, events }) => {
    ga('set', 'page', '/bubbles');
    ga('set', 'title', 'Bubbles View');
    ga('send', 'pageview');

    const $ = selector => root.querySelector(selector);
    const pane = $('.left-pane');
    const svg = d3.select($('.bubbles'));
    let width = 0, height = 0, bubbles = [];

    const simulation = d3.forceSimulation()
      .velocityDecay(0.2)
      .on('tick', () => svg.selectAll('circle').attr('cx', d => d.x).attr('cy', d => d.y));

    // A bubble per visible node, keeping the places of those already drawn
    function update() {
      const before = new Map(bubbles.map(b => [b._id, b]));
      bubbles = MT.getVisibleNodes().map(d => {
        const old = before.get(d._id);
        return { _id: d._id, node: d, x: old ? old.x : width / 2, y: old ? old.y : height / 2 };
      });
      svg.selectAll('circle')
        .data(bubbles, b => b._id)
        .join(enter => enter.append('circle')
          .attr('stroke-width', 2)
          .attr('cx', b => b.x)
          .attr('cy', b => b.y)
          .on('click', (event, b) => {
            b.node.selected = !b.node.selected;
            events.emit('node-selected', 'bubbles');
          }))
        .attr('r', settings.get('bubble-size'));
      simulation.nodes(bubbles);
      setColors();
      group();
    }

    function setColors() {
      const variable = settings.get('node-color-variable'), color = settings.get('node-color'), selected = settings.get('selected-color');
      svg.selectAll('circle')
        .attr('stroke', b => b.node.selected ? selected : '#ffffff')
        .attr('fill', b => variable == 'None' ? color : temp.style.nodeColorMap(b.node[variable]));
    }

    // Each axis spreads the bubbles over the values of its variable, labelled,
    // or pulls them to the middle
    function group() {
      [['x', width, 'bubble-x'], ['y', height, 'bubble-y']].forEach(([axis, length, key]) => {
        const field = settings.get(key);
        const label = svg.select(`.${axis}-label`);
        const force = axis == 'x' ? d3.forceX() : d3.forceY();
        if (!field || field == 'None') {
          label.text('');
          svg.selectAll(`.${axis}title`).remove();
          simulation.force(axis, force.strength(0.03)[axis](length / 2));
          return;
        }
        label.text(MT.titleize(field));
        const values = Array.from(new Set(bubbles.map(b => b.node[field])));
        if (values.every(v => typeof v == 'number')) values.sort((a, b) => axis == 'x' ? a - b : b - a);
        else values.sort();
        const ratio = length / (values.length + 1);
        const place = v => ratio * values.indexOf(v) + ratio;
        svg.selectAll(`.${axis}title`)
          .data(values)
          .join('text')
          .attr('class', `${axis}title`)
          .attr('text-anchor', 'middle')
          .text(v => v)
          .each(function (v) {
            const title = d3.select(this);
            if (axis == 'x') title.attr('x', place(v)).attr('y', 50).attr('transform', null);
            else title.attr('x', 50).attr('y', place(v)).attr('transform', `rotate(270, 50, ${place(v)})`);
          });
        simulation.force(axis, force.strength(0.03)[axis](b => place(b.node[field])));
      });
      simulation.force('charge', d3.forceManyBody().strength(-settings.get('bubble-charge')));
      simulation.alpha(1).restart();
    }

    function resize() {
      width = root.clientWidth;
      height = root.clientHeight;
      svg.attr('width', width).attr('height', height);
      svg.select('.x-label').attr('x', width / 2);
      svg.select('.y-label').attr('x', 20).attr('y', height / 2).attr('transform', `rotate(270, 20, ${height / 2})`);
      group();
    }

    function setBackground() {
      svg.style('background-color', settings.get('background-color'));
      svg.style('fill', settings.get('background-color-contrast'));
    }

    MT.paneToggle($('.settings-toggle'), pane);
    MT.svgExport(root, () => svg.node(), settings);

    const stop = [
      MTBind(pane, settings),
      settings.subscribe(['bubble-x', 'bubble-y', 'bubble-charge'], group),
      settings.subscribe('bubble-size', size => svg.selectAll('circle').attr('r', size)),
      events.on('background-color-change', setBackground),
      ...['node-color-change', 'selected-color-change', 'node-selected'].map(type => events.on(type, setColors)),
      ...['node-visibility', 'cluster-visibility'].map(type => events.on(type, update))
    ];
    width = root.clientWidth;
    height = root.clientHeight;
    update();
    resize();
    setBackground();

    return {
      resize,
      destroy() {
        stop.forEach(fn => fn());
        simulation.stop();
      }
    };
  });
</script>
