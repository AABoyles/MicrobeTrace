<div class="sequences-panel"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Sequences Settings">
    <span class="oi oi-cog"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#sequences-export-modal" title="Export Sequences">
    <span class="oi oi-data-transfer-download"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item active">
      <a href="#sequences-configurations" class="nav-link active" aria-controls="sequences-configurations" role="tab" data-bs-toggle="tab">Sequences</a>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="sequences-configurations" role="tabpanel">
      <div class="form-group row" title="How wide should each cell in the sequences viewer be?">
        <div class="col-3"><label for="sequences-cell-width">Width</label></div>
        <div class="col-9">
          <input type="number" id="sequences-cell-width" class="form-control form-control-sm" data-setting="sequences-cell-width" min="1" value="2">
        </div>
      </div>
      <div class="form-group row" title="How tall should each cell in the sequences viewer be?">
        <div class="col-3"><label for="sequences-cell-height">Height</label></div>
        <div class="col-9">
          <input type="number" id="sequences-cell-height" class="form-control form-control-sm" data-setting="sequences-cell-height" min="1" value="12">
        </div>
      </div>
      <div class="form-group row" title="Should the sequences viewer include the nucleotide character in each cell?
For large sets of sequences, this can take a long time.">
        <div class="col-3">Characters</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
            <label class="btn btn-light active col">
              <input type="radio" name="sequences-show-chars" data-setting="sequences-show-chars" value="true" autocomplete="off" checked> Show
            </label>
            <label class="btn btn-light col">
              <input type="radio" name="sequences-show-chars" data-setting="sequences-show-chars" value="false" autocomplete="off"> Hide
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="sequences-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Sequences</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" class="form-select form-select-sm">
              <option selected>png</option>
              <option>fasta</option>
              <option>mega</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-error" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script>
  MT.registerView('sequences', (root, { settings, events }) => {
    ga('set', 'page', '/sequences');
    ga('set', 'title', 'Sequences View');
    ga('send', 'pageview');

    const $ = selector => root.querySelector(selector);
    const panel = $('.sequences-panel');
    const pane = $('.left-pane');
    let canvas = null, transform = d3.zoomIdentity, request = 0, destroyed = false;

    const sequences = () => session.data.nodes.filter(d => d.seq);

    function place() {
      if (canvas) canvas.style.transform = `translate(${Math.round(transform.x)}px,${Math.round(transform.y)}px) scale(${transform.k})`;
    }

    // Draws the alignment, replacing the last one when it's ready
    function draw() {
      const ticket = ++request;
      const width = settings.get('sequences-cell-width'), height = settings.get('sequences-cell-height');
      if (!(width >= 1) || !(height >= 1)) return;
      // The viewer labels rows by id; give it copies, so the nodes stay as they are
      alignmentViewer(sequences().map(d => ({ id: d._id, seq: d.seq })), {
        width: 0 | width,
        height: 0 | height,
        showChar: settings.get('sequences-show-chars')
      }).then(c => {
        // A newer drawing, or a closed view, makes this one moot
        if (ticket != request || destroyed) return;
        if (canvas) canvas.remove();
        canvas = c;
        canvas.style.transformOrigin = '0 0';
        panel.append(canvas);
        place();
      });
    }

    const zoom = d3.zoom().scaleExtent([0.1, 8]).on('zoom', event => {
      transform = event.transform;
      place();
    });
    d3.select(panel).call(zoom);
    panel.addEventListener('mousedown', () => { panel.style.cursor = 'grabbing'; });
    panel.addEventListener('mouseup', () => { panel.style.cursor = 'grab'; });

    const setBackground = () => { panel.style.background = settings.get('background-color'); };

    const saveText = (prefix, extension) => filename => saveAs(
      new Blob([sequences().map(d => prefix + d._id + '\r\n' + d.seq).join('\r\n')]),
      filename + '.' + extension
    );

    MT.paneToggle($('.settings-toggle'), pane);
    MT.tableExport(root, {
      png: filename => canvas && canvas.toBlob(blob => saveAs(blob, filename + '.png')),
      fasta: saveText('>', 'fasta'),
      mega: saveText('#', 'mega')
    });

    const stop = [
      MTBind(pane, settings),
      settings.subscribe(['sequences-cell-width', 'sequences-cell-height', 'sequences-show-chars'], draw),
      events.on('background-color-change', setBackground)
    ];
    draw();
    setBackground();

    return {
      destroy() {
        destroyed = true;
        stop.forEach(fn => fn());
        d3.select(panel).on('.zoom', null);
      }
    };
  });
</script>
