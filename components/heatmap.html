<div class="heatmap-plot"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Heatmap Settings">
    <span class="bi bi-gear"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#heatmap-export-modal" title="Export Heatmap">
    <span class="bi bi-download"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item active">
      <a href="#heatmap-configurations" id="heatmap-tab" class="nav-link active" aria-controls="heatmap" role="tab" data-bs-toggle="tab">Heatmap</a>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="heatmap-configurations" role="tabpanel" aria-labelledby="heatmap-tab">
      <div class="form-group row" title="Would you like to invert the axes?">
        <div class="col-3">Invert</div>
        <div class="col-9">
          <div class="row">
            <div class="col">
              <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
                <label class="btn btn-light" title="Would you like to invert the X axis?">
                  <input type="checkbox" data-setting="heatmap-invertX"> X-Axis
                </label>
              </div>
            </div>
            <div class="col">
              <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
                <label class="btn btn-light" title="Would you like to invert the Y axis?">
                  <input type="checkbox" data-setting="heatmap-invertY"> Y-Axis
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group row" title="What color scheme would you like the heatmap to use?">
        <div class="col-3">Color Scheme</div>
        <div class="col-3">
          <input type="color" class="form-control form-control-sm" data-setting="heatmap-color-high" value="#a50026" title="Highest distances">
        </div>
        <div class="col-3">
          <input type="color" class="form-control form-control-sm" data-setting="heatmap-color-medium" value="#ffffbf" title="Middle distances">
        </div>
        <div class="col-3">
          <input type="color" class="form-control form-control-sm" data-setting="heatmap-color-low" value="#313695" title="Lowest distances">
        </div>
      </div>
      <div class="form-group row" title="Would you like to show axis labels on the heatmap?">
        <div class="col-3">Axis Labels</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
            <label class="btn btn-light col">
              <input type="radio" name="heatmap-axislabels" data-setting="heatmap-axislabels-show" value="true" autocomplete="off"> Show
            </label>
            <label class="btn btn-light active col">
              <input type="radio" name="heatmap-axislabels" data-setting="heatmap-axislabels-show" value="false" autocomplete="off" checked> Hide
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="heatmap-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Heatmap</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" class="form-select form-select-sm">
              <option selected>png</option>
              <option>jpeg</option>
              <option>webp</option>
              <option>svg</option>
              <option>csv</option>
              <option>xlsx</option>
            </select>
          </div>
        </div>
        <div class="form-group row mb-0">
          <div class="col-3 offset-9">
            <button class="btn btn-link btn-sm w-100 text-end export-advanced-button" type="button" data-bs-toggle="collapse" data-bs-target="#heatmap-export-advanced" aria-expanded="false" aria-controls="heatmap-export-advanced">Advanced</button>
          </div>
        </div>
        <div class="collapse" id="heatmap-export-advanced" style="margin-top: 10px;">
          <div class="card card-body">
            <div class="form-group row">
              <div class="col-3">
                <label for="heatmap-export-scale">Scale</label>
              </div>
              <div class="col-9">
                <input type="number" id="heatmap-export-scale" name="export-scale" class="form-control form-control-sm" min="0" step="0.1" value="1">
              </div>
            </div>
            <div class="form-group row">
              <div class="col-3">Resolution</div>
              <div class="col-9 text-end export-dimensions"></div>
            </div>
            <div class="row">
              <div class="col-3">
                <label for="heatmap-export-quality">Quality</label>
              </div>
              <div class="col-9">
                <input type="range" class="form-range" id="heatmap-export-quality" name="export-quality" min="0" max="1.0" value="0.92" step="0.01">
              </div>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top: 10px;">
          <div class="col-3">
            <label for="heatmap-export-opacity">Watermark Opacity</label>
          </div>
          <div class="col-9">
            <input type="range" id="heatmap-export-opacity" name="export-opacity" min="0.0" max="1.0" value="0.4" step="0.01">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script>
  MT.registerView('heatmap', (root, { settings, events }) => {
    ga('set', 'page', '/heatmap');
    ga('set', 'title', 'Heatmap View');
    ga('send', 'pageview');

    const $ = selector => root.querySelector(selector);
    const plot = $('.heatmap-plot');
    const pane = $('.left-pane');

    // The distance matrix and its labels as last drawn (before any inversion),
    // for export
    let labels = [], matrix = [], drawing = 0;

    async function draw() {
      const width = root.clientWidth, height = root.clientHeight;
      // A view in a background tab has no size; it draws when it's shown
      if (!width || !height) return;
      const ticket = ++drawing;
      const dm = await MT.getDM();
      // A newer draw started while this one waited
      if (ticket != drawing) return;
      labels = MT.getDMLabels();
      matrix = dm;
      let x = labels.map(d => 'N' + d), y = x.slice(), z = dm;
      if (settings.get('heatmap-invertX')) {
        z = z.map(row => row.slice().reverse());
        x.reverse();
      }
      if (settings.get('heatmap-invertY')) {
        z = z.slice().reverse();
        y.reverse();
      }
      const showLabels = settings.get('heatmap-axislabels-show');
      const axis = { autotick: false, showticklabels: showLabels, ticks: showLabels ? undefined : '' };
      Plotly.react(plot, [{
        x, y, z,
        type: 'heatmap',
        colorscale: [
          [0, settings.get('heatmap-color-low')],
          [0.5, settings.get('heatmap-color-medium')],
          [1, settings.get('heatmap-color-high')]
        ]
      }], {
        width, height,
        xaxis: axis,
        yaxis: axis,
        ...MT.plotColors(settings)
      }, {
        displaylogo: false,
        displayModeBar: false
      });
    }

    // A new size needs no new matrix
    function resize() {
      if (!plot.data) return draw();
      if (root.clientWidth && root.clientHeight) Plotly.relayout(plot, { width: root.clientWidth, height: root.clientHeight });
    }

    const table = () => [[''].concat(labels)].concat(matrix.map((row, i) => [labels[i]].concat(row)));
    MT.paneToggle($('.settings-toggle'), pane);
    MT.plotExport(root, plot, settings, {
      csv: filename => MT.saveAs(new Blob([Papa.unparse(table())], { type: 'text/csv;charset=utf-8' }), filename + '.csv'),
      xlsx: filename => {
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(table()), 'Distances');
        XLSX.writeFile(workbook, filename + '.xlsx');
      }
    });

    const stop = [
      MTBind(pane, settings),
      settings.subscribe(['heatmap-invertX', 'heatmap-invertY', 'heatmap-axislabels-show', 'heatmap-color-low', 'heatmap-color-medium', 'heatmap-color-high'], draw),
      events.on('background-color-change', () => plot.data && Plotly.relayout(plot, MT.plotColors(settings)))
    ];
    draw();

    return {
      resize,
      destroy() {
        stop.forEach(fn => fn());
        drawing++;
        Plotly.purge(plot);
      }
    };
  });
</script>
