<div class="flow-plot"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Flow Diagram Settings">
    <span class="bi bi-gear"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#flow-export-modal" title="Export Flow Diagram">
    <span class="bi bi-download"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item active">
      <a href="#flow-configurations" id="flow-tab" class="nav-link active" aria-controls="flow" role="tab" data-bs-toggle="tab">Flow Diagram</a>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="flow-configurations" role="tabpanel" aria-labelledby="flow-tab">
      <div class="form-group row" title="Should the Flow Diagram show Node or Link Variables?">
        <div class="col-3">Dataset</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
            <label class="btn btn-light col active">
              <input type="radio" name="flow-dataset" data-setting="flow-showNodes" value="true" autocomplete="off" checked> Nodes
            </label>
            <label class="btn btn-light col">
              <input type="radio" name="flow-dataset" data-setting="flow-showNodes" value="false" autocomplete="off"> Links
            </label>
          </div>
        </div>
      </div>
      <div class="form-group row" title="Which variables, in what order, would you like to see in the Flow Diagram?">
        <div class="col-3">Variables</div>
        <div class="col-9">
          <ul class="flow-variables"></ul>
          <button type="button" class="btn btn-outline-primary btn-sm w-100 flow-add-variable">Add Variable</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="flow-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Flow Diagram</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" class="form-select form-select-sm">
              <option selected>png</option>
              <option>jpeg</option>
              <option>webp</option>
              <option>svg</option>
            </select>
          </div>
        </div>
        <div class="form-group row mb-0">
          <div class="col-3 offset-9">
            <button class="btn btn-link btn-sm w-100 text-end export-advanced-button" type="button" data-bs-toggle="collapse" data-bs-target="#flow-export-advanced" aria-expanded="false" aria-controls="flow-export-advanced">Advanced</button>
          </div>
        </div>
        <div class="collapse" id="flow-export-advanced" style="margin-top: 10px;">
          <div class="card card-body">
            <div class="form-group row">
              <div class="col-3">
                <label for="flow-export-scale">Scale</label>
              </div>
              <div class="col-9">
                <input type="number" id="flow-export-scale" name="export-scale" class="form-control form-control-sm" min="0" step="0.1" value="1">
              </div>
            </div>
            <div class="form-group row">
              <div class="col-3">Resolution</div>
              <div class="col-9 text-end export-dimensions"></div>
            </div>
            <div class="row">
              <div class="col-3">
                <label for="flow-export-quality">Quality</label>
              </div>
              <div class="col-9">
                <input type="range" class="form-range" id="flow-export-quality" name="export-quality" min="0" max="1.0" value="0.92" step="0.01">
              </div>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top: 10px;">
          <div class="col-3">
            <label for="flow-export-opacity">Watermark Opacity</label>
          </div>
          <div class="col-9">
            <input type="range" id="flow-export-opacity" name="export-opacity" min="0.0" max="1.0" value="0.4" step="0.01">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script>
  MT.registerView('flow_diagram', (root, { settings, events }) => {
    ga('set', 'page', '/flow_diagram');
    ga('set', 'title', 'Flow Diagram View');
    ga('send', 'pageview');

    const $ = selector => root.querySelector(selector);
    const plot = $('.flow-plot');
    const pane = $('.left-pane');
    const list = $('.flow-variables');

    const fields = () => session.data[settings.get('flow-showNodes') ? 'nodeFields' : 'linkFields'];
    const options = (value) => fields().map(f => `<option value="${f}"${f == value ? ' selected' : ''}>${MT.titleize(f)}</option>`).join('');
    // A variable the dataset doesn't have becomes its cluster, or first field
    const valid = value => fields().includes(value) ? value : fields().includes('cluster') ? 'cluster' : fields()[0];

    function addVariable(value) {
      const item = document.createElement('li');
      item.className = 'flow-items';
      item.innerHTML = `<span class="bi bi-x flow-remove" title="Remove this variable"></span>
        <select class="form-select form-select-sm flow-selector">${options(valid(value))}</select>
        <span class="bi bi-arrow-down-up" title="Drag to reorder"></span>`;
      list.appendChild(item);
      sortable(list, 'reload');
    }

    function showFields() {
      list.querySelectorAll('select').forEach(select => { select.innerHTML = options(valid(select.value)); });
    }

    // One sankey column per variable, with a node per value; links count the
    // items going from each value to each value of the next variable.
    function draw() {
      const width = root.clientWidth - 40, height = root.clientHeight - 60;
      // A view in a background tab has no size; it draws when it's shown
      if (width <= 0 || height <= 0) return;
      const nodes = settings.get('flow-showNodes');
      const items = nodes ? MT.getVisibleNodes() : MT.getVisibleLinks();
      const order = Array.from(list.querySelectorAll('select'), select => select.value);

      const index = new Map(), labels = [], columns = [];
      order.forEach((variable, column) => {
        new Set(items.map(d => d[variable] + '')).forEach(value => {
          index.set(column + '\u0000' + value, labels.length);
          labels.push(MT.titleize(value));
          columns.push(MT.titleize(variable));
        });
      });
      const counts = new Map();
      for (let column = 0; column < order.length - 1; column++) {
        items.forEach(d => {
          const key = index.get(column + '\u0000' + d[order[column]]) + ',' + index.get((column + 1) + '\u0000' + d[order[column + 1]]);
          counts.set(key, (counts.get(key) || 0) + 1);
        });
      }
      const source = [], target = [], value = [];
      counts.forEach((count, key) => {
        const [s, t] = key.split(',').map(Number);
        source.push(s);
        target.push(t);
        value.push(count);
      });

      Plotly.react(plot, [{
        type: 'sankey',
        orientation: 'h',
        arrangement: 'snap',
        node: {
          pad: 15,
          thickness: 30,
          line: { color: 'black', width: 0.5 },
          label: labels,
          color: settings.get(nodes ? 'node-color' : 'link-color'),
          customdata: columns,
          hovertemplate: '<b> %{customdata}:  %{label} </b><br>Incoming flow count: %{targetLinks.length} <br>Outgoing flow count: %{sourceLinks.length}<extra>%{value}</extra>'
        },
        link: { source, target, value }
      }], {
        width, height,
        ...MT.plotColors(settings)
      }, {
        displaylogo: false,
        displayModeBar: false
      });
    }

    MT.paneToggle($('.settings-toggle'), pane);
    MT.plotExport(root, plot, settings);

    $('.flow-add-variable').addEventListener('click', () => {
      addVariable('cluster');
      draw();
    });
    list.addEventListener('change', draw);
    list.addEventListener('click', e => {
      if (!e.target.classList.contains('flow-remove')) return;
      e.target.closest('li').remove();
      draw();
    });
    sortable(list, { forcePlaceholderSize: true });
    list.addEventListener('sortupdate', draw);

    // Older sessions store the dataset as something other than a boolean
    settings.set('flow-showNodes', !!settings.get('flow-showNodes'));
    // It starts on the first two categorical fields, or the clusters
    const items = settings.get('flow-showNodes') ? MT.getVisibleNodes() : MT.getVisibleLinks();
    const [first = 'cluster', second = first] = MT.categoricalFields(items, fields());
    addVariable(first);
    addVariable(second);
    const stop = [
      MTBind(pane, settings),
      settings.subscribe('flow-showNodes', () => { showFields(); draw(); }),
      ...['node-selected', 'node-visibility', 'link-visibility', 'node-color-change', 'link-color-change']
        .map(type => events.on(type, draw)),
      events.on('background-color-change', () => plot.data && Plotly.relayout(plot, MT.plotColors(settings)))
    ];
    draw();

    return {
      resize: draw,
      destroy() {
        stop.forEach(fn => fn());
        sortable(list, 'destroy');
        Plotly.purge(plot);
      }
    };
  });
</script>
