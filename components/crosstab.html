<div class="table-sm crosstab-grid"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Toggle crosstab Settings">
    <span class="bi bi-gear"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#crosstab-export-modal" title="Export crosstab data">
    <span class="bi bi-download"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm crosstab-pivot" title="Pivot Crosstab">
    <span class="bi bi-arrow-repeat"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item active">
      <a href="#crosstab-settings" id="crosstab-tab" class="nav-link active" aria-controls="crosstab" role="tab" data-bs-toggle="tab">Crosstab</a>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" role="tabpanel" aria-labelledby="crosstab-tab">
      <div class="form-group row" title="What data fields would you like to aggregate on?">
        <div class="col-3">Dataset</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
            <label class="btn btn-light col active">
              <input type="radio" name="crosstab-dataset" value="nodes" autocomplete="off" checked> Nodes
            </label>
            <label class="btn btn-light col">
              <input type="radio" name="crosstab-dataset" value="links" autocomplete="off"> Links
            </label>
            <label class="btn btn-light col">
              <input type="radio" name="crosstab-dataset" value="clusters" autocomplete="off"> Clusters
            </label>
          </div>
        </div>
      </div>
      <div class="form-group row" title="What data fields would you like to aggregate on?">
        <div class="col-3"><label for="crosstab-field-x">X Variable</label></div>
        <div class="col-9">
          <select id="crosstab-field-x" class="form-select form-select-sm crosstab-x"></select>
        </div>
      </div>
      <div class="form-group row" title="What data fields would you like to aggregate on?">
        <div class="col-3"><label for="crosstab-field-y">Y Variable</label></div>
        <div class="col-9">
          <select id="crosstab-field-y" class="form-select form-select-sm crosstab-y"></select>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="crosstab-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Crosstab</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" class="form-select form-select-sm">
              <option selected>csv</option>
              <option>xlsx</option>
              <option>pdf</option>
              <option>json</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script>
  MT.registerView('crosstab', (root, { events }) => {
    ga('set', 'page', '/crosstab');
    ga('set', 'title', 'Crosstab View');
    ga('send', 'pageview');

    const $ = selector => root.querySelector(selector);
    const fieldX = $('.crosstab-x'), fieldY = $('.crosstab-y');
    // data: a row per Y value; headers and rows: the same for export
    let dataset = 'nodes', data = [], headers = [], rows = [], chosen = false;

    const table = new Tabulator($('.crosstab-grid'), { layout: 'fitColumns', data: [], columns: [] });
    const built = new Promise(resolve => table.on('tableBuilt', resolve));

    const items = () => MT['getVisible' + dataset[0].toUpperCase() + dataset.slice(1)]();

    // The menus offer the dataset's fields, starting on its first two
    // categorical fields. Without any, the table waits for a choice.
    function showFields() {
      const fields = session.data[dataset.slice(0, -1) + 'Fields'];
      const options = fields.map(f => `<option value="${f}">${MT.titleize(f)}</option>`).join('');
      fieldX.innerHTML = options;
      fieldY.innerHTML = options;
      const [x, y = x] = MT.categoricalFields(items(), fields);
      chosen = !!x;
      if (chosen) [fieldX.value, fieldY.value] = [x, y];
    }

    // Values in natural order (2 before 10), missing ones last
    const missing = v => MT.valueLabel(v) == '(Empty)';
    const natural = (a, b) => (missing(a) - missing(b)) || a.localeCompare(b, undefined, { numeric: true });

    // One row per Y value, headed by the Y variable, and one column per X value,
    // under a heading naming the X variable, counting the visible items. The
    // columns are v0, v1… (a value, with a dot say, may not be a usable field).
    async function update() {
      if (!chosen) {
        data = headers = rows = [];
        await built;
        table.setColumns([]);
        table.replaceData([]);
        return;
      }
      const xVar = fieldX.value, yVar = fieldY.value;
      const visible = items();
      const xValues = Array.from(new Set(visible.map(d => String(d[xVar])))).sort(natural);
      const column = new Map(xValues.map((x, i) => [x, 'v' + i]));
      const byY = new Map();
      visible.forEach(d => {
        const y = String(d[yVar]);
        if (!byY.has(y)) {
          const row = { col: MT.valueLabel(y) };
          xValues.forEach((x, i) => row['v' + i] = 0);
          byY.set(y, row);
        }
        byY.get(y)[column.get(String(d[xVar]))]++;
      });
      data = Array.from(byY.keys()).sort(natural).map(y => byY.get(y));
      headers = [MT.titleize(yVar)].concat(xValues.map(MT.valueLabel));
      rows = data.map(row => [row.col].concat(xValues.map((x, i) => row['v' + i])));
      await built;
      table.setColumns([
        { title: MT.titleize(yVar), field: 'col', cssClass: 'fw-bold', sorter: 'alphanum' },
        { title: MT.titleize(xVar), columns: xValues.map((x, i) => ({ title: MT.valueLabel(x), field: 'v' + i })) }
      ]);
      table.replaceData(data);
    }

    root.querySelectorAll('[name="crosstab-dataset"]').forEach(input => input.addEventListener('change', () => {
      if (!input.checked) return;
      dataset = input.value;
      showFields();
      update();
    }));
    [fieldX, fieldY].forEach(select => select.addEventListener('change', () => {
      chosen = true;
      update();
    }));
    $('.crosstab-pivot').addEventListener('click', () => {
      [fieldX.value, fieldY.value] = [fieldY.value, fieldX.value];
      update();
    });

    showFields();
    // The settings start open when there's nothing to show until a choice
    MT.paneToggle($('.settings-toggle'), $('.left-pane'), !chosen);

    const title = () => MT.titleize(fieldX.value) + ' by ' + MT.titleize(fieldY.value);
    MT.tableExport(root, {
      csv: name => MT.saveAs(new Blob([Papa.unparse({ fields: headers, data: rows })], { type: 'text/csv;charset=utf-8' }), name + '.csv'),
      xlsx: name => {
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet([headers].concat(rows)), title().slice(0, 31));
        XLSX.writeFile(workbook, name + '.xlsx');
      },
      pdf: name => MT.tablesPDF('Crosstab: ' + title(), [{ headers, rows: rows.map(row => row.map(cell => cell + '')) }], name),
      json: name => {
        const objects = rows.map(row => Object.fromEntries(headers.map((h, i) => [h, row[i]])));
        MT.saveAs(new Blob([JSON.stringify(objects)], { type: 'application/json;charset=utf-8' }), name + '.json');
      }
    });

    root.style.zIndex = 1000;

    update();
    const stop = ['link-visibility', 'node-visibility'].map(type => events.on(type, update));

    return {
      resize: () => table.redraw(),
      destroy() {
        stop.forEach(fn => fn());
        table.destroy();
      }
    };
  });
</script>
