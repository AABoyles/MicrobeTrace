<div class="table-sm crosstab-grid"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Crosstab Settings">
    <span class="bi bi-gear"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#crosstab-export-modal" title="Export crosstab data">
    <span class="bi bi-download"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm crosstab-pivot" title="Pivot Crosstab">
    <span class="bi bi-arrow-left-right"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item active" role="presentation">
      <a href="#crosstab-settings" id="crosstab-tab" class="nav-link active" role="tab" data-bs-toggle="tab" aria-controls="crosstab-settings" aria-selected="true">Crosstab</a>
    </li>
  </ul>
  <div class="tab-content">
    <div id="crosstab-settings" class="tab-pane fade show active" role="tabpanel" aria-labelledby="crosstab-tab">
      <div class="form-group row" title="What data fields would you like to aggregate on?">
        <div class="col-3">Dataset</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100">
            <label class="btn btn-light col">
              <input type="radio" name="crosstab-dataset" value="nodes" autocomplete="off" checked> Nodes
            </label>
            <label class="btn btn-light col">
              <input type="radio" name="crosstab-dataset" value="links" autocomplete="off"> Links
            </label>
            <label class="btn btn-light col">
              <input type="radio" name="crosstab-dataset" value="clusters" autocomplete="off"> Clusters
            </label>
          </div>
        </div>
      </div>
      <div class="form-group row" title="What data fields would you like to aggregate on?">
        <div class="col-3"><label for="crosstab-field-x">X Variable</label></div>
        <div class="col-9">
          <select id="crosstab-field-x" class="form-select form-select-sm crosstab-x"></select>
        </div>
      </div>
      <div class="form-group row" title="What data fields would you like to aggregate on?">
        <div class="col-3"><label for="crosstab-field-y">Y Variable</label></div>
        <div class="col-9">
          <select id="crosstab-field-y" class="form-select form-select-sm crosstab-y"></select>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="crosstab-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false" aria-labelledby="crosstab-export-modal-title">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="crosstab-export-modal-title" class="modal-title h5">Export Crosstab</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" aria-label="Filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" aria-label="Format" class="form-select form-select-sm">
              <option value="csv" selected>CSV</option>
              <option value="xlsx">Excel (XLSX)</option>
              <option value="pdf">PDF</option>
              <option value="json">JSON</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->
