<canvas class="globe"></canvas>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Globe Settings">
    <span class="bi bi-gear"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#globe-export-modal" title="Export Globe">
    <span class="bi bi-download"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm fit-button" title="Fit to the Nodes">
    <span class="bi bi-bullseye"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm autorotate-toggle" title="Toggle Autorotation">
    <span class="bi bi-play-fill"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li role="presentation" class="nav-item">
      <a id="globe-data-tab" href="#globe-data-configurations" class="nav-link active" role="tab" data-bs-toggle="tab" aria-controls="globe-data-configurations" aria-selected="true">Data</a>
    </li>
    <li role="presentation" class="nav-item">
      <a id="globe-layer-tab" href="#globe-layer-configurations" class="nav-link" role="tab" data-bs-toggle="tab" aria-controls="globe-layer-configurations" aria-selected="false">Layers</a>
    </li>
    <li role="presentation" class="nav-item">
      <a id="globe-node-tab" href="#globe-node-configurations" class="nav-link" role="tab" data-bs-toggle="tab" aria-controls="globe-node-configurations" aria-selected="false">Nodes</a>
    </li>
    <li role="presentation" class="nav-item">
      <a id="globe-link-tab" href="#globe-link-configurations" class="nav-link" role="tab" data-bs-toggle="tab" aria-controls="globe-link-configurations" aria-selected="false">Links</a>
    </li>
  </ul>
  <div class="tab-content">
    <div role="tabpanel" class="tab-pane fade show active" id="globe-data-configurations" aria-labelledby="globe-data-tab">
      <div class="row">
        <div class="col-12">
          <div class="alert alert-info alert-dismissible" role="alert">
            Please select the most precise geographic data your inputs have.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        </div>
      </div>
      <div class="form-group row" title="If your data have a latitude variable, select that here.">
        <div class="col-4"><label for="globe-field-lat">Latitude</label></div>
        <div class="col-8">
          <select id="globe-field-lat" class="nodeVariables form-select form-select-sm" data-setting="globe-field-lat">
            <option selected>None</option>
          </select>
        </div>
      </div>
      <div class="form-group row" title="If your data have a longitude variable, select that here.">
        <div class="col-4"><label for="globe-field-lon">Longitude</label></div>
        <div class="col-8">
          <select id="globe-field-lon" class="nodeVariables form-select form-select-sm" data-setting="globe-field-lon">
            <option selected>None</option>
          </select>
        </div>
      </div>
      <div class="form-group row" title="If your data have a Census Tract variable, select that here.">
        <div class="col-4"><label for="globe-field-tract">Census Tract</label></div>
        <div class="col-8">
          <select id="globe-field-tract" class="nodeVariables form-select form-select-sm" data-setting="globe-field-tract">
            <option selected>None</option>
          </select>
        </div>
      </div>
      <div class="form-group row" title="If your data have a zipcode variable, select that here.">
        <div class="col-4"><label for="globe-field-zipcode">Zipcode</label></div>
        <div class="col-8">
          <select id="globe-field-zipcode" class="nodeVariables form-select form-select-sm" data-setting="globe-field-zipcode">
            <option selected>None</option>
          </select>
        </div>
      </div>
      <div class="form-group row" title="If your data have a County variable, select that here.">
        <div class="col-4"><label for="globe-field-county">County</label></div>
        <div class="col-8">
          <select id="globe-field-county" class="nodeVariables form-select form-select-sm" data-setting="globe-field-county">
            <option selected>None</option>
          </select>
        </div>
      </div>
      <div class="form-group row" title="If your data have a (US) State variable, select that here.">
        <div class="col-4"><label for="globe-field-state">State</label></div>
        <div class="col-8">
          <select id="globe-field-state" class="nodeVariables form-select form-select-sm" data-setting="globe-field-state">
            <option selected>None</option>
          </select>
        </div>
      </div>
      <div class="form-group row" title="If your data have a Country variable, select that here.">
        <div class="col-4"><label for="globe-field-country">Country</label></div>
        <div class="col-8">
          <select id="globe-field-country" class="nodeVariables form-select form-select-sm" data-setting="globe-field-country">
            <option selected>None</option>
          </select>
        </div>
      </div>
    </div>
    <div role="tabpanel" class="tab-pane fade" id="globe-layer-configurations" aria-labelledby="globe-layer-tab">
      <div class="accordion" id="globe-layers-accordion">
        <div class="card">
          <div class="card-header p-0">
            <button class="bg-transparent border-0 w-100" type="button" data-bs-toggle="collapse" data-bs-target="#globe-layers-network" aria-expanded="false" aria-controls="globe-layers-network" style="color:var(--mt-muted-strong)">Network</button>
          </div>
          <div id="globe-layers-network" class="collapse" data-bs-parent="#globe-layers-accordion">
            <div class="card-body">
              <div class="form-group row" title="Would you like to see Nodes on the globe?">
                <div class="col-4">Nodes</div>
                <div class="col-8">
                  <div class="btn-group btn-group-toggle btn-group-sm w-100">
                    <label class="btn btn-light col">
                      <input type="radio" name="globe-node-options" data-setting="globe-node-show" value="true" autocomplete="off" checked>
                      Show
                    </label>
                    <label class="btn btn-light col">
                      <input type="radio" name="globe-node-options" data-setting="globe-node-show" value="false" autocomplete="off"> Hide
                    </label>
                  </div>
                </div>
              </div>
              <div class="form-group row" title="Would you like to see links on the globe?">
                <div class="col-4">Links</div>
                <div class="col-8">
                  <div class="btn-group btn-group-toggle btn-group-sm w-100">
                    <label class="btn btn-light col">
                      <input type="radio" name="globe-link-options" data-setting="globe-link-show" value="true" autocomplete="off" checked>
                      Show
                    </label>
                    <label class="btn btn-light col">
                      <input type="radio" name="globe-link-options" data-setting="globe-link-show" value="false" autocomplete="off"> Hide
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header p-0">
            <button class="bg-transparent border-0 w-100" type="button" data-bs-toggle="collapse" data-bs-target="#globe-layers-vectors" aria-expanded="true" aria-controls="globe-layers-vectors" style="color:var(--mt-muted-strong)">Geospatial</button>
          </div>
          <div id="globe-layers-vectors" class="collapse show" data-bs-parent="#globe-layers-accordion">
            <div class="card-body">
              <div class="form-group row" title="Would you like to see stars around the globe?">
                <div class="col-4">Stars</div>
                <div class="col-8">
                  <div class="btn-group btn-group-toggle btn-group-sm w-100">
                    <label class="btn btn-light col">
                      <input type="radio" name="globe-stars-options" data-setting="globe-stars-show" value="true" autocomplete="off" checked>
                      Show
                    </label>
                    <label class="btn btn-light col">
                      <input type="radio" name="globe-stars-options" data-setting="globe-stars-show" value="false" autocomplete="off"> Hide
                    </label>
                  </div>
                </div>
              </div>
              <div class="form-group row" title="Would you like to see the countries' borders on the globe?">
                <div class="col-4">Borders</div>
                <div class="col-8">
                  <div class="btn-group btn-group-toggle btn-group-sm w-100">
                    <label class="btn btn-light col">
                      <input type="radio" name="globe-country-options" data-setting="globe-countries-show" value="true" autocomplete="off">
                      Show
                    </label>
                    <label class="btn btn-light col">
                      <input type="radio" name="globe-country-options" data-setting="globe-countries-show" value="false" autocomplete="off" checked>
                      Hide
                    </label>
                  </div>
                </div>
              </div>
              <div class="form-group row" title="Would you like to see a graticule on the globe?">
                <div class="col-4">Graticule</div>
                <div class="col-8">
                  <div class="btn-group btn-group-toggle btn-group-sm w-100">
                    <label class="btn btn-light col">
                      <input type="radio" name="globe-graticule-options" data-setting="globe-graticule-show" value="true" autocomplete="off">
                      Show
                    </label>
                    <label class="btn btn-light col">
                      <input type="radio" name="globe-graticule-options" data-setting="globe-graticule-show" value="false" autocomplete="off" checked>
                      Hide
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header p-0">
            <button class="bg-transparent border-0 w-100" type="button" data-bs-toggle="collapse" data-bs-target="#globe-layers-user" aria-expanded="true" aria-controls="globe-layers-user" style="color:var(--mt-muted-strong)">User-Provided</button>
          </div>
          <div id="globe-layers-user" class="collapse" data-bs-parent="#globe-layers-accordion">
            <div class="card-body">
              <div class="row">
                <div class="col-12">
                  <div class="alert alert-info alert-dismissible" role="alert">
                    Load a GeoJSON file below to add it to the globe.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                </div>
              </div>
              <div class="form-group row" title="Import GeoJSON Map Data here">
                <div class="col-12">
                  <input type="file" class="form-control form-control-sm geojson-input" multiple aria-label="GeoJSON files">
                </div>
              </div>
              <div class="form-group row geojson-layers" title="GeoJSON Layers"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div role="tabpanel" class="tab-pane fade" id="globe-node-configurations" aria-labelledby="globe-node-tab">
      <div class="form-group row">
        <div class="col-4">Color</div>
        <div class="col-8"><button class="btn btn-sm btn-light w-100 launch-color-options">Color Options</button></div>
      </div>
      <div class="form-group row" title="How transparent would you like the nodes to be?">
        <div class="col-4"><label for="globe-node-transparency">Transparency</label></div>
        <div class="col-8">
          <input type="range" class="form-range" id="globe-node-transparency" data-setting="globe-node-transparency" min="0.00" max="1.00" step="0.01" value="0.00">
        </div>
      </div>
      <div class="form-group row" title="How much randomness do you want to add to node locations?">
        <div class="col-4">
          <label for="globe-node-jitter">Jitter</label>
          <button type="button" class="btn btn-light btn-sm reroll-button">Reroll</button>
        </div>
        <div class="col-8">
          <input type="range" class="form-range" id="globe-node-jitter" data-setting="globe-node-jitter" min="-2" max="4" step="0.01" value="-2" aria-describedby="globe-node-jitter-help"><div id="globe-node-jitter-help" class="form-text small">Moves nodes at the same place apart by up to 2<sup>value</sup> degrees. Far left is off.</div>
        </div>
      </div>
    </div>
    <div role="tabpanel" class="tab-pane fade" id="globe-link-configurations" aria-labelledby="globe-link-tab">
      <div class="form-group row">
        <div class="col-4">Color</div>
        <div class="col-8"><button class="btn btn-sm btn-light w-100 launch-color-options">Color Options</button></div>
      </div>
      <div class="form-group row" title="How transparent would you like links to be?">
        <div class="col-4"><label for="globe-link-transparency">Transparency</label></div>
        <div class="col-8">
          <input type="range" class="form-range" id="globe-link-transparency" data-setting="globe-link-transparency" min="0.00" max="1.00" step="0.01" value="0.00">
        </div>
      </div>
    </div>
  </div>
</div>

<div id="globe-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false" aria-labelledby="globe-export-modal-title">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="globe-export-modal-title" class="modal-title h5">Export Globe</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" aria-label="Filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" aria-label="Format" class="form-select form-select-sm">
              <option value="png" selected>PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
              <option value="geojson">GeoJSON</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script src="components/globe.js"></script>
