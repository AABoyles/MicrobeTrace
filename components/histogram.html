<div class="histogram-plot"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Histogram Settings">
    <span class="oi oi-cog"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#histogram-export-modal" title="Export Histogram">
    <span class="oi oi-data-transfer-download"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item active">
      <a href="#histogram-settings" id="histogram-tab" class="nav-link active" aria-controls="histogram" role="tab" data-bs-toggle="tab">Histogram</a>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="histogram-settings" role="tabpanel" aria-labelledby="histogram-tab">
      <div class="form-group row" title="Which variable should the histogram be drawn from?">
        <div class="col-3"><label for="histogram-variable">Variable</label></div>
        <div class="col-9">
          <select id="histogram-variable" class="form-select form-select-sm mixedVariables" data-setting="histogram-variable">
            <option selected>distance</option>
          </select>
        </div>
      </div>
      <div class="form-group row" title="Which axis should the histogram be drawn across?">
        <div class="col-3">Axis</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
            <label class="btn btn-light active col" title="Align the histogram along the X Axis">
              <input type="radio" name="histogram-axis" data-setting="histogram-axis-x" value="true" autocomplete="off" checked> X
            </label>
            <label class="btn btn-light col" title="Align the histogram along the Y Axis">
              <input type="radio" name="histogram-axis" data-setting="histogram-axis-x" value="false" autocomplete="off"> Y
            </label>
          </div>
        </div>
      </div>
      <div class="form-group row" title="Should the y-axis show a linear or logarithmic scale?">
        <div class="col-3">Scale</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
            <label class="btn btn-light col active" title="Scale the Histogram linearly">
              <input type="radio" name="histogram-scale" data-setting="histogram-scale-log" value="false" autocomplete="off" checked> Linear
            </label>
            <label class="btn btn-light col" title="Scale the Histogram logarithmically">
              <input type="radio" name="histogram-scale" data-setting="histogram-scale-log" value="true" autocomplete="off"> Log
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="histogram-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Histogram</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" class="form-select form-select-sm">
              <option selected>png</option>
              <option>jpeg</option>
              <option>webp</option>
              <option>svg</option>
            </select>
          </div>
        </div>
        <div class="form-group row mb-0">
          <div class="col-3 offset-9">
            <button class="btn btn-primary btn-sm w-100 export-advanced-button" type="button" data-bs-toggle="collapse" data-bs-target="#histogram-export-advanced" aria-expanded="false" aria-controls="histogram-export-advanced">Advanced</button>
          </div>
        </div>
        <div class="collapse" id="histogram-export-advanced" style="margin-top: 10px;">
          <div class="card card-body">
            <div class="form-group row">
              <div class="col-3">
                <label for="histogram-export-scale">Scale</label>
              </div>
              <div class="col-9">
                <input type="number" id="histogram-export-scale" name="export-scale" class="form-control form-control-sm" min="0" step="0.1" value="1">
              </div>
            </div>
            <div class="form-group row">
              <div class="col-3">Resolution</div>
              <div class="col-9 text-end export-dimensions"></div>
            </div>
            <div class="row">
              <div class="col-3">
                <label for="histogram-export-quality">Quality</label>
              </div>
              <div class="col-9">
                <input type="range" class="form-range" id="histogram-export-quality" name="export-quality" min="0" max="1.0" value="0.92" step="0.01">
              </div>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top: 10px;">
          <div class="col-3">
            <label for="histogram-export-opacity">Watermark Opacity</label>
          </div>
          <div class="col-9">
            <input type="range" id="histogram-export-opacity" name="export-opacity" min="0.0" max="1.0" value="0.4" step="0.01">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-error" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script>
  MT.registerView('histogram', (root, { settings, events }) => {
    ga('set', 'page', '/histogram');
    ga('set', 'title', 'Histogram View');
    ga('send', 'pageview');

    const $ = selector => root.querySelector(selector);
    const plot = $('.histogram-plot');
    const pane = $('.left-pane');

    // One histogram trace per color when the bars are colored by a variable
    function traces(source, field, axis) {
      const items = source == 'nodes' ? MT.getVisibleNodes() : MT.getVisibleLinks();
      const trace = (values, color) => ({ type: 'histogram', [axis]: values, marker: { color }, showlegend: false, hoverinfo: 'skip' });
      const colorBy = settings.get(source == 'nodes' ? 'node-color-variable' : 'link-color-variable');
      const colored = source == 'nodes' ? colorBy !== 'None' : !['None', 'origin'].includes(colorBy);
      if (!colored) {
        return [trace(items.map(d => d[field]), settings.get(source == 'nodes' ? 'node-color' : 'link-color'))];
      }
      const distinct = new Set();
      if (source == 'nodes') session.data.nodes.forEach(d => distinct.add(d[colorBy]));
      else session.data.graph.forEachValue(colorBy, v => distinct.add(v));
      const colorMap = source == 'nodes' ? temp.style.nodeColorMap : temp.style.linkColorMap;
      return Array.from(distinct)
        .map(v => trace(items.filter(d => d[colorBy] == v).map(d => d[field]), colorMap(v)))
        // Smaller groups first, so they stack at the bottom (#242)
        .sort((a, b) => a[axis].length - b[axis].length);
    }

    function draw() {
      const width = root.clientWidth, height = root.clientHeight;
      // A view in a background tab has no size; it draws when it's shown
      if (!width || !height) return;
      const [source, ...rest] = settings.get('histogram-variable').split('-');
      const field = rest.join('-');
      const axis = settings.get('histogram-axis-x') ? 'x' : 'y', countAxis = axis == 'x' ? 'y' : 'x';
      const data = traces(source, field, axis);
      const background = settings.get('background-color');
      Plotly.react(plot, data, {
        width, height,
        barmode: data.length > 1 ? 'stack' : undefined,
        paper_bgcolor: background,
        plot_bgcolor: background,
        font: { color: settings.get('background-color-contrast') },
        [axis + 'axis']: { title: { text: MT.titleize(field) } },
        [countAxis + 'axis']: {
          title: { text: 'Number of ' + MT.titleize(source) },
          type: settings.get('histogram-scale-log') ? 'log' : '-'
        }
      }, {
        displaylogo: false,
        displayModeBar: false,
        scrollZoom: true
      });
    }

    // Settings pane
    let paneOpen = false;
    const toggle = $('.settings-toggle');
    toggle.addEventListener('click', () => {
      paneOpen = !paneOpen;
      toggle.classList.toggle('active', paneOpen);
      MT.slidePane(pane, paneOpen);
    });

    // Export dialog
    const field = name => $(`[name="${name}"]`);
    const advancedButton = $('.export-advanced-button'), advanced = $('#histogram-export-advanced');
    field('export-filetype').addEventListener('change', e => {
      const svg = e.target.value == 'svg';
      advancedButton.hidden = svg;
      if (svg) bootstrap.Collapse.getOrCreateInstance(advanced, { toggle: false }).hide();
    });
    const showDimensions = () => {
      const scale = parseFloat(field('export-scale').value);
      $('.export-dimensions').textContent = Math.round(root.clientWidth * scale) + 'x' + Math.round(root.clientHeight * scale) + 'px';
    };
    field('export-scale').addEventListener('input', showDimensions);
    $('#histogram-export-modal').addEventListener('show.bs.modal', showDimensions);

    $('.export-button').addEventListener('click', () => {
      const svg = plot.querySelector('.main-svg');
      // Plotly draws axis titles in a second SVG layer; bring them into this one
      const titles = plot.querySelector('.main-svg .infolayer');
      if (titles) svg.appendChild(titles);
      const watermark = d3.select(svg).append('image')
        .attr('xlink:href', MT.watermark)
        .attr('height', 128)
        .attr('width', 128)
        .attr('x', 10)
        .style('opacity', field('export-opacity').value);
      const filename = field('export-filename').value, filetype = field('export-filetype').value;
      if (filetype == 'svg') {
        saveAs(new Blob([MT.unparseSVG(svg)], { type: 'image/svg+xml;charset=utf-8' }), filename + '.' + filetype);
        watermark.remove();
      } else {
        saveSvgAsPng(svg, filename + '.' + filetype, {
          scale: parseFloat(field('export-scale').value),
          backgroundColor: settings.get('background-color'),
          encoderType: 'image/' + filetype,
          encoderOptions: parseFloat(field('export-quality').value)
        }).then(() => watermark.remove());
      }
    });

    const stop = [
      MTBind(pane, settings),
      settings.subscribe(['histogram-variable', 'histogram-axis-x', 'histogram-scale-log'], draw),
      ...['node-color-change', 'link-color-change', 'background-color-change', 'node-visibility', 'link-visibility']
        .map(type => events.on(type, draw))
    ];
    draw();

    return {
      resize: draw,
      destroy() {
        stop.forEach(fn => fn());
        Plotly.purge(plot);
      }
    };
  });
</script>
