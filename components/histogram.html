<div class="histogram-plot"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Histogram Settings">
    <span class="bi bi-gear"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#histogram-export-modal" title="Export Histogram">
    <span class="bi bi-download"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item active" role="presentation">
      <a href="#histogram-settings" id="histogram-tab" class="nav-link active" role="tab" data-bs-toggle="tab" aria-controls="histogram-settings" aria-selected="true">Histogram</a>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="histogram-settings" role="tabpanel" aria-labelledby="histogram-tab">
      <div class="form-group row" title="Which variable should the histogram be drawn from?">
        <div class="col-3"><label for="histogram-variable">Variable</label></div>
        <div class="col-9">
          <select id="histogram-variable" class="form-select form-select-sm mixedVariables" data-setting="histogram-variable">
            <option selected>distance</option>
          </select>
        </div>
      </div>
      <div class="form-group row" title="Which axis should the histogram be drawn across?">
        <div class="col-3">Axis</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100">
            <label class="btn btn-light col" title="Align the histogram along the X Axis">
              <input type="radio" name="histogram-axis" data-setting="histogram-axis-x" value="true" autocomplete="off" checked> X
            </label>
            <label class="btn btn-light col" title="Align the histogram along the Y Axis">
              <input type="radio" name="histogram-axis" data-setting="histogram-axis-x" value="false" autocomplete="off"> Y
            </label>
          </div>
        </div>
      </div>
      <div class="form-group row" title="Should the y-axis show a linear or logarithmic scale?">
        <div class="col-3">Scale</div>
        <div class="col-9">
          <div class="btn-group btn-group-toggle btn-group-sm w-100">
            <label class="btn btn-light col" title="Scale the Histogram linearly">
              <input type="radio" name="histogram-scale" data-setting="histogram-scale-log" value="false" autocomplete="off" checked> Linear
            </label>
            <label class="btn btn-light col" title="Scale the Histogram logarithmically">
              <input type="radio" name="histogram-scale" data-setting="histogram-scale-log" value="true" autocomplete="off"> Log
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="histogram-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false" aria-labelledby="histogram-export-modal-title">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="histogram-export-modal-title" class="modal-title h5">Export Histogram</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" aria-label="Filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" aria-label="Format" class="form-select form-select-sm">
              <option value="png" selected>PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
              <option value="svg">SVG</option>
            </select>
          </div>
        </div>
        <div class="form-group row mb-0">
          <div class="col-3 offset-9">
            <button class="btn btn-link btn-sm w-100 text-end export-advanced-button" type="button" data-bs-toggle="collapse" data-bs-target="#histogram-export-advanced" aria-expanded="false" aria-controls="histogram-export-advanced">Advanced</button>
          </div>
        </div>
        <div class="collapse" id="histogram-export-advanced" style="margin-top: 10px;">
          <div class="card card-body">
            <div class="form-group row">
              <div class="col-3">
                <label for="histogram-export-scale">Scale</label>
              </div>
              <div class="col-9">
                <input type="number" id="histogram-export-scale" name="export-scale" class="form-control form-control-sm" min="0" step="0.1" value="1">
                <div class="form-text">Multiplies the size of the picture as shown. 1 = as shown; 2 = twice as wide and tall.</div>
              </div>
            </div>
            <div class="form-group row">
              <div class="col-3">Resolution</div>
              <div class="col-9 text-end"><span class="export-dimensions"></span><div class="form-text">Size of the image in pixels (width x height).</div></div>
            </div>
            <div class="row">
              <div class="col-3">
                <label for="histogram-export-quality">Quality</label>
              </div>
              <div class="col-9">
                <input type="range" class="form-range" id="histogram-export-quality" name="export-quality" min="0" max="1.0" value="0.92" step="0.01">
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->
