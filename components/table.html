<div class="table-sm table-grid" style="overflow: auto"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#table-export-modal" title="Export table data">
    <span class="bi bi-download"></span>
  </button>
  <div class="dropdown d-inline-block">
    <button type="button" class="btn btn-light btn-sm table-text-size-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" title="Text Size">
      <span class="bi bi-type"></span>
    </button>
    <div class="dropdown-menu p-2 table-text-size">
      <label for="table-font-size" class="form-label small mb-1">Text Size</label>
      <input type="range" class="form-range table-font-size" id="table-font-size" min="6" value="14" max="72" step="1">
    </div>
  </div>
  <div class="btn-group btn-group-toggle btn-group-sm" data-toggle="buttons" title="What dataset would you like to view?">
    <label class="btn btn-light active">
      <input type="radio" name="table-dataset" value="nodes" autocomplete="off" checked> Nodes
    </label>
    <label class="btn btn-light">
      <input type="radio" name="table-dataset" value="links" autocomplete="off"> Links
    </label>
    <label class="btn btn-light">
      <input type="radio" name="table-dataset" value="clusters" autocomplete="off"> Clusters
    </label>
  </div>
  <select class="table-columns" multiple title="What columns would you like to see?" aria-label="Columns"></select>
</div>

<div id="table-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false" aria-labelledby="table-export-modal-title">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="table-export-modal-title" class="modal-title">Export Table</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" aria-label="Filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" aria-label="Format" class="form-select form-select-sm">
              <option value="csv" selected>CSV</option>
              <option value="xlsx">Excel (XLSX)</option>
              <option value="json">JSON</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script>
  MT.registerView('table', (root, { settings, events }) => {
    ga('set', 'page', '/table');
    ga('set', 'title', 'Table View');
    ga('send', 'pageview');

    const $ = selector => root.querySelector(selector);
    const grid = $('.table-grid');
    const columnsSelect = $('.table-columns');
    // Bookkeeping fields that aren't worth a column
    const hidden = ['selected', 'visible', 'nn'];
    let dataset = 'nodes', columnsMenu;

    const highlight = row => {
      row.getElement().style.background = row.getData().selected ? settings.get('selected-color') : '';
    };
    // Columns as wide as their contents, the last taking what's left
    const table = MT.table(grid, {
      maxHeight: '100%',
      layout: 'fitDataStretch',
      data: [],
      columns: [],
      rowFormatter: highlight
    });
    const built = new Promise(resolve => table.on('tableBuilt', resolve));

    // Clicking a row selects it (or deselects it), keeping selected rows on top
    table.on('rowClick', (e, row) => {
      const item = row.getData();
      item.selected = !item.selected;
      highlight(row);
      if (item.selected) row.freeze();
      else row.unfreeze();
      events.emit('node-selected', 'table');
    });

    function showColumns() {
      const fields = session.data[dataset.slice(0, -1) + 'Fields'].filter(f => !hidden.includes(f));
      if (columnsMenu) columnsMenu.destroy();
      // The first five, less the internal counter (still there to choose)
      const shown = fields.filter(f => f != 'index').slice(0, 5);
      columnsSelect.innerHTML = fields.map(f => `<option value="${f}"${shown.includes(f) ? ' selected' : ''}>${MT.titleize(f)}</option>`).join('');
      columnsMenu = MT.multiSelect(columnsSelect);
      columnsMenu.on('change', showData);
    }

    // A cell's value as text, lists (like a node's files) joined with commas
    const listed = cell => {
      const value = cell.getValue();
      return document.createTextNode(Array.isArray(value) ? value.join(', ') : value == null ? '' : String(value));
    };

    // Every node and cluster, but only the links that are visible: the full
    // set includes every computed distance (n² of them).
    const items = () => dataset == 'links' ? MT.getVisibleLinks() : session.data[dataset];

    async function showData() {
      await built;
      // In the order they were chosen
      const columns = columnsMenu.getValue();
      table.setColumns(columns.map(c => ({ title: MT.titleize(c), field: c, formatter: listed })));
      await table.replaceData(items());
      table.getRows().forEach(row => { if (row.getData().selected) row.freeze(); });
    }

    // Selections and colors changed elsewhere
    function restyle() {
      table.getRows().forEach(row => {
        highlight(row);
        if (row.getData().selected) row.freeze();
        else if (row.isFrozen()) row.unfreeze();
      });
    }

    root.querySelectorAll('[name="table-dataset"]').forEach(input => input.addEventListener('change', () => {
      if (!input.checked) return;
      dataset = input.value;
      showColumns();
      showData();
    }));

    const fontSize = $('.table-font-size');
    // It starts at the size the text is
    fontSize.value = Math.round(parseFloat(getComputedStyle(grid).fontSize)) || fontSize.value;
    fontSize.addEventListener('input', () => {
      grid.style.fontSize = fontSize.value + 'px';
      grid.style.lineHeight = fontSize.value / 10;
    });


    // Exports every row shown, with all its fields, not just the columns shown
    const rows = () => JSON.parse(JSON.stringify(items()));
    MT.tableExport(root, {
      csv: name => MT.saveAs(new Blob([Papa.unparse(rows())], { type: 'text/csv;charset=utf-8' }), name + '.csv'),
      xlsx: name => {
        const headers = session.data[dataset.slice(0, -1) + 'Fields'];
        const data = rows().map(item => {
          const row = {};
          headers.forEach(field => {
            if (field in item) row[field] = Array.isArray(item[field]) ? item[field].join('; ') : item[field];
          });
          return row;
        });
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, XLSX.utils.json_to_sheet(data), MT.titleize(dataset));
        XLSX.writeFile(workbook, name + '.xlsx');
      },
      json: name => MT.saveAs(new Blob([JSON.stringify(rows())], { type: 'application/json;charset=utf-8' }), name + '.json')
    });


    // The toolbar grows when the chosen columns wrap onto more lines: keep the
    // table below it
    const controls = $('.view-controls');
    const belowControls = new ResizeObserver(() => {
      const top = controls.offsetTop + controls.offsetHeight + 8;
      if (grid.style.paddingTop == top + 'px') return;
      grid.style.paddingTop = top + 'px';
      built.then(() => table.redraw());
    });
    belowControls.observe(controls);

    const stop = [
      events.on('link-visibility', showData),
      events.on('node-values-change', () => { if (dataset == 'nodes') showData(); }),
      events.on('node-selected', view => { if (view != 'table') restyle(); }),
      events.on('selected-color-change', restyle)
    ];
    showColumns();
    showData();

    return {
      resize: () => table.redraw(),
      destroy() {
        stop.forEach(fn => fn());
        belowControls.disconnect();
        if (columnsMenu) columnsMenu.destroy();
        table.destroy();
      }
    };
  });
</script>
