<div class="map-canvas h-100"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Choropleth Settings">
    <span class="oi oi-cog"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#choropleth-export-modal" title="Export Choropleth">
    <span class="oi oi-data-transfer-download"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm fit-button" title="Fit to the Regions">
    <span class="oi oi-target"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li role="presentation" class="nav-item">
      <a href="#choropleth-data-configurations" class="nav-link active" aria-controls="choropleth-data-configurations" role="tab" data-bs-toggle="tab">Data</a>
    </li>
    <li role="presentation" class="nav-item">
      <a href="#choropleth-layer-configurations" class="nav-link" aria-controls="choropleth-layer-configurations" role="tab" data-bs-toggle="tab">Layers</a>
    </li>
  </ul>
  <div class="tab-content">
    <div role="tabpanel" class="tab-pane fade show active" id="choropleth-data-configurations">
      <div class="form-group row" title="What kind of Choropleth do you want to see?">
        <div class="col-4"><label for="choropleth-aggregate-as">Aggregate Across</label></div>
        <div class="col-8">
          <select id="choropleth-aggregate-as" class="form-select form-select-sm" data-setting="choropleth-aggregate-as">
            <option value="counties">County FIPS Code</option>
            <option value="states" selected>State</option>
            <option value="countries">Country</option>
          </select>
        </div>
      </div>
      <div class="form-group row" title="Select the variable that corresponds to the value selected above.">
        <div class="col-4"><label for="choropleth-aggregate-on">Field</label></div>
        <div class="col-8">
          <select id="choropleth-aggregate-on" class="nodeVariables form-select form-select-sm" data-setting="choropleth-aggregate-on">
            <option selected>None</option>
          </select>
        </div>
      </div>
    </div>
    <div role="tabpanel" class="tab-pane fade" id="choropleth-layer-configurations">
      <div class="accordion" id="choropleth-layers-accordion">
        <div class="card">
          <div class="card-header p-0">
            <button class="bg-transparent border-0 w-100" type="button" data-bs-toggle="collapse" data-bs-target="#choropleth-layers-choropleth" aria-expanded="true" aria-controls="choropleth-layers-choropleth" style="color:#495057">Choropleth</button>
          </div>
          <div id="choropleth-layers-choropleth" class="collapse" data-bs-parent="#choropleth-layers-accordion">
            <div class="card-body">
              <div class="form-group row" title="What color scheme would you like the choropleth to use?">
                <div class="col-4">Color Scheme</div>
                <div class="col">
                  <input type="color" class="form-control form-control-sm" data-setting="choropleth-color-low" value="#ffffcc">
                </div>
                <div class="col">
                  <input type="color" class="form-control form-control-sm" data-setting="choropleth-color-medium" value="#fd8d3c">
                </div>
                <div class="col">
                  <input type="color" class="form-control form-control-sm" data-setting="choropleth-color-high" value="#800026">
                </div>
              </div>
              <div class="form-group row">
                <div class="col-4">
                  <label for="choropleth-transparency">Transparency</label>
                </div>
                <div class="col-8">
                  <input type="range" class="form-range" id="choropleth-transparency" data-setting="choropleth-transparency" min="0" value="0.3" max="1" step="0.01">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header p-0">
            <button class="bg-transparent border-0 w-100" type="button" data-bs-toggle="collapse" data-bs-target="#choropleth-layers-tiles" aria-expanded="true" aria-controls="choropleth-layers-tiles" style="color:#495057">Online</button>
          </div>
          <div id="choropleth-layers-tiles" class="collapse show" data-bs-parent="#choropleth-layers-accordion">
            <div class="card-body">
              <div class="row">
                <div class="col-12">
                  <div class="alert alert-warning alert-dismissible" role="alert">
                    Enabling any of the layers below will download tiles from the Internet.
                    <a href="https://github.com/CDCgov/MicrobeTrace/wiki/Tile-maps">Read More.</a>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                </div>
              </div>
              <div class="form-group row ifOnline" title="Would you like to use a Tile basemap?">
                <div class="col-4">Basemap</div>
                <div class="col-8">
                  <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
                    <label class="btn btn-light col">
                      <input type="radio" name="choropleth-basemap-options" data-setting="choropleth-basemap-show" value="true" autocomplete="off"> Show
                    </label>
                    <label class="btn btn-light active col">
                      <input type="radio" name="choropleth-basemap-options" data-setting="choropleth-basemap-show" value="false" autocomplete="off" checked> Hide
                    </label>
                  </div>
                </div>
              </div>
              <div class="form-group row ifOnline" title="Would you like to use a Satellite layer?">
                <div class="col-4">Satellite</div>
                <div class="col-8">
                  <div class="btn-group btn-group-toggle btn-group-sm w-100" data-toggle="buttons">
                    <label class="btn btn-light col">
                      <input type="radio" name="choropleth-satellite-options" data-setting="choropleth-satellite-show" value="true" autocomplete="off"> Show
                    </label>
                    <label class="btn btn-light active col">
                      <input type="radio" name="choropleth-satellite-options" data-setting="choropleth-satellite-show" value="false" autocomplete="off" checked> Hide
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header p-0">
            <button class="bg-transparent border-0 w-100" type="button" data-bs-toggle="collapse" data-bs-target="#choropleth-layers-user" aria-expanded="true" aria-controls="choropleth-layers-user" style="color:#495057">User-Provided</button>
          </div>
          <div id="choropleth-layers-user" class="collapse" data-bs-parent="#choropleth-layers-accordion">
            <div class="card-body">
              <div class="row">
                <div class="col-12">
                  <div class="alert alert-info alert-dismissible" role="alert">
                    Load a GeoJSON file below to superimpose it on the choropleth.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                </div>
              </div>
              <div class="form-group row" title="Import GeoJSON choropleth Data here">
                <div class="col-12">
                  <input type="file" class="form-control form-control-sm geojson-input" multiple>
                </div>
              </div>
              <div class="form-group row geojson-layers" title="GeoJSON Layers"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="choropleth-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Choropleth</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" class="form-select form-select-sm">
              <option selected>png</option>
              <option>jpeg</option>
              <option>webp</option>
              <option>geojson</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-error" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script>
  MT.registerView('choropleth', (root, { settings, events }) => {
    ga('set', 'page', '/choropleth');
    ga('set', 'title', 'Choropleth View');
    ga('send', 'pageview');

    const $ = selector => root.querySelector(selector);
    const pane = $('.left-pane');
    const map = L.map($('.map-canvas'), {
      center: [39.8, -98.5],
      zoom: 5,
      zoomControl: false,
      maxZoom: 20,
      preferCanvas: true
    });
    const layers = { ...MT.tileLayers(), countries: null, aggregates: null };

    // The legend: the color ramp, labelled with the lowest and highest counts
    const legendCanvas = document.createElement('canvas');
    legendCanvas.width = 256;
    legendCanvas.height = 25;
    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = () => {
      const div = L.DomUtil.create('div', 'legend');
      div.append(legendCanvas);
      return div;
    };
    legend.addTo(map);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    // Each kind of region: its map file, the keys a node's value may match it
    // by, and the node fields that likely hold them
    const units = {
      countries: { file: 'countries.json', keys: f => [f.id, f.properties.name], fields: ['country'] },
      states: { file: 'states.json', keys: f => [f.properties.usps, f.properties.name], fields: ['state'] },
      counties: { file: 'counties.json', keys: f => [f.properties.fips, parseFloat(f.properties.fips)], fields: ['county', 'fips'] }
    };
    const unit = () => units[settings.get('choropleth-aggregate-as')] || units.states;

    // With no field chosen, a node field named for the kind of region is used
    function pickField() {
      const field = settings.get('choropleth-aggregate-on');
      if (field && field != 'None' && session.data.nodeFields.includes(field)) return;
      const match = session.data.nodeFields.find(f => unit().fields.includes(f.toLowerCase()));
      if (match) settings.set('choropleth-aggregate-on', match);
    }

    // The regions, each with its count of visible nodes (properties.density)
    let regions = null, request = 0, destroyed = false;
    async function aggregate() {
      const ticket = ++request, { file, keys } = unit();
      const data = await MT.getMapData(file);
      // A newer request, or a closed view, makes this one moot
      if (ticket != request || destroyed) return;
      const index = new Map();
      data.features.forEach(f => keys(f).forEach(k => {
        if (k != null && k === k) index.set(String(k), f);
      }));
      const counts = new Map(), field = settings.get('choropleth-aggregate-on');
      if (field && field != 'None') MT.getVisibleNodes().forEach(d => {
        const v = d[field];
        if (v == null || v === '') return;
        const number = parseFloat(v);
        const region = index.get(String(v)) || (isFinite(number) && index.get(String(number)));
        if (region) counts.set(region, (counts.get(region) || 0) + 1);
      });
      regions = {
        type: 'FeatureCollection',
        features: data.features.map(f => ({ ...f, properties: { ...f.properties, density: counts.get(f) || 0 } }))
      };
      draw();
    }

    const ramp = () => d3.scaleLinear().domain([0, 0.5, 1]).range([
      settings.get('choropleth-color-low'),
      settings.get('choropleth-color-medium'),
      settings.get('choropleth-color-high')
    ]);
    const opacity = () => 1 - settings.get('choropleth-transparency');

    function draw() {
      if (!regions) return;
      if (layers.aggregates) layers.aggregates.remove();
      const densities = regions.features.map(f => f.properties.density);
      const min = Math.min(...densities), max = Math.max(...densities), range = max - min;
      const color = ramp();
      layers.aggregates = L.geoJSON(regions, {
        style: f => ({
          fillColor: color(range ? (f.properties.density - min) / range : 0),
          weight: 2,
          opacity: 1,
          color: '#dadde0',
          fillOpacity: opacity()
        }),
        onEachFeature: (f, layer) => layer
          .on('mouseover', e => MT.tooltip(`<b>${f.properties.name}</b>&nbsp;${f.properties.density}`, e.originalEvent))
          .on('mouseout', () => MT.tooltip(null))
      }).addTo(map);
      drawLegend(color, min, max);
    }

    function drawLegend(color, min, max) {
      const context = legendCanvas.getContext('2d');
      for (let i = 0; i < 256; ++i) {
        context.fillStyle = d3.rgb(color(i / 255)).formatHex();
        context.fillRect(i, 0, 1, 25);
      }
      context.font = 'bold 20px sans';
      context.textAlign = 'left';
      context.fillStyle = 'black';
      context.fillText(min + '', 5, 20);
      context.fillStyle = 'white';
      context.textAlign = 'right';
      context.fillText(max + '', 251, 20);
      legendCanvas.style.opacity = opacity();
    }

    function setTransparency() {
      legendCanvas.style.opacity = opacity();
      if (layers.aggregates) layers.aggregates.setStyle({ fillOpacity: opacity() });
    }

    // The tile layers take turns, and the countries show when neither does
    function showLayers() {
      const basemap = settings.get('choropleth-basemap-show'), satellite = settings.get('choropleth-satellite-show');
      MT.showLayer(map, layers.basemap, basemap);
      MT.showLayer(map, layers.satellite, satellite);
      MT.showLayer(map, layers.countries, !basemap && !satellite);
      // The countries are behind the regions
      if (layers.aggregates) layers.aggregates.bringToFront();
    }
    const takeTurns = other => value => {
      if (value) settings.set(other, false);
      showLayers();
    };

    MT.getMapData('countries.json').then(data => {
      if (destroyed) return;
      layers.countries = L.geoJSON(data, { color: '#dadde0', weight: 1, fillColor: '#fafaf8', fillOpacity: 1 });
      showLayers();
    });

    $('.fit-button').addEventListener('click', () => {
      if (!layers.aggregates) return;
      // Fit the regions that have nodes, or all of them if none do
      const counted = layers.aggregates.getLayers().filter(l => l.feature.properties.density > 0);
      map.flyToBounds((counted.length ? L.featureGroup(counted) : layers.aggregates).getBounds());
    });

    MT.paneToggle($('.settings-toggle'), pane);
    const userLayers = MT.geoJSONUpload($('.geojson-input'), $('.geojson-layers'), map);
    MT.tableExport(root, {
      ...Object.fromEntries(['png', 'jpeg', 'webp'].map(type => [type, filename => MT.mapImage(map, filename, type, (context, canvas) => {
        context.globalAlpha = opacity();
        context.drawImage(legendCanvas, 10, canvas.height - 40);
      })])),
      geojson: filename => saveAs(
        new Blob([JSON.stringify(regions)], { type: 'application/json;charset=utf-8' }),
        filename + '.geojson'
      )
    });

    pickField();
    const stop = [
      MTBind(pane, settings),
      settings.subscribe('choropleth-aggregate-as', pickField),
      settings.subscribe(['choropleth-aggregate-as', 'choropleth-aggregate-on'], aggregate),
      settings.subscribe(['choropleth-color-low', 'choropleth-color-medium', 'choropleth-color-high'], draw),
      settings.subscribe('choropleth-transparency', setTransparency),
      settings.subscribe('choropleth-basemap-show', takeTurns('choropleth-satellite-show')),
      settings.subscribe('choropleth-satellite-show', takeTurns('choropleth-basemap-show')),
      events.on('node-visibility', aggregate)
    ];
    aggregate();
    showLayers();

    const handle = temp.choropleth = { map, layers, userLayers };
    return {
      resize: () => map.invalidateSize(),
      destroy() {
        destroyed = true;
        stop.forEach(fn => fn());
        MT.tooltip(null);
        map.remove();
        if (temp.choropleth === handle) delete temp.choropleth;
      }
    };
  });
</script>
