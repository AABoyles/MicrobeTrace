<div class="table-sm aggregation-grid"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Aggregation Settings">
    <span class="bi bi-gear"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#aggregation-export-modal" title="Export Aggregation data">
    <span class="bi bi-download"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item active">
      <a href="#aggregation-settings" id="aggregation-tab" class="nav-link active" aria-controls="aggregation" role="tab" data-bs-toggle="tab">
        Aggregation
      </a>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" role="tabpanel" aria-labelledby="aggregation-tab">
      <div class="form-group row" title="What data field would you like to aggregate on?">
        <div class="col-3">Tables</div>
        <div class="col-9">
          <ul class="aggregation-variables"></ul>
          <button type="button" class="btn btn-outline-primary btn-sm w-100 aggregation-add-variable">
            Add Variable
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="aggregation-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Aggregation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" class="form-select form-select-sm">
              <option value="csv.zip" selected>CSV (zipped)</option>
              <option value="xlsx">Excel (XLSX)</option>
              <option value="pdf">PDF</option>
              <option value="json">JSON</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script>
  MT.registerView('aggregation', (root, { events }) => {
    ga('set', 'page', '/aggregation');
    ga('set', 'title', 'Aggregation View');
    ga('send', 'pageview');

    const $ = selector => root.querySelector(selector);
    const grid = $('.aggregation-grid'), list = $('.aggregation-variables');
    // One Tabulator per variable, and the counts they show (for export)
    let tables = [], data = [];

    const datasets = { node: 'nodeFields', link: 'linkFields', cluster: 'clusterFields' };
    const options = value => Object.entries(datasets).map(([dataset, fields]) =>
      session.data[fields].map(f => {
        const v = dataset + ' ' + f;
        return `<option value="${v}"${v == value ? ' selected' : ''}>${MT.titleize(dataset)} ${MT.titleize(f)}</option>`;
      }).join('')
    ).join('');

    function addVariable(value) {
      const item = document.createElement('li');
      item.className = 'd-inline-flex aggregation-items';
      item.innerHTML = `<span class="bi bi-x pt-2 aggregation-remove" title="Remove this table"></span>
        <select class="flex-grow-1 form-select form-select-sm aggregation-variable">${options(value)}</select>
        <span class="pt-2 bi bi-grip-vertical" title="Drag to reorder"></span>`;
      list.appendChild(item);
      sortable(list, 'reload');
    }

    // How many of the visible items have each value of a variable
    function count(dataset, column) {
      const items = MT['getVisible' + dataset[0].toUpperCase() + dataset.slice(1) + 's']();
      const counts = new Map();
      items.forEach(d => {
        const value = MT.valueLabel(d[column]) == '(Empty)' ? '(Empty)' : d[column];
        counts.set(value, (counts.get(value) || 0) + 1);
      });
      // Most common first (ties in the values' order), each a share to one decimal
      const natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
      return Array.from(counts, ([value, n]) => ({ [column]: value, n, percent: (n / items.length * 100).toFixed(1) + '%' }))
        .sort((a, b) => b.n - a.n || natural(a[column], b[column]));
    }

    function update() {
      tables.forEach(table => table.destroy());
      grid.innerHTML = '';
      tables = [];
      data = Array.from(list.querySelectorAll('select'), select => {
        const [dataset, ...rest] = select.value.split(' ');
        const column = rest.join(' ');
        const rows = count(dataset, column);
        const element = document.createElement('div');
        element.className = 'aggregation-tables table-sm';
        grid.appendChild(element);
        tables.push(new Tabulator(element, {
          layout: 'fitColumns',
          columns: [
            // A natural sort, so numbers (cluster IDs, say) don't sort as text
            { title: MT.titleize(dataset) + ' ' + MT.titleize(column), field: column, sorter: 'alphanum' },
            { title: `Number of ${MT.titleize(dataset)}s`, field: 'n', hozAlign: 'right', headerHozAlign: 'right' },
            { title: 'Percentage', field: 'percent', headerSort: false, hozAlign: 'right', headerHozAlign: 'right' }
          ],
          data: rows,
          // One sort, by the count (rows come in that order already)
          initialSort: [{ column: 'n', dir: 'desc' }]
        }));
        return { dataset, column, data: rows };
      });
    }

    $('.aggregation-add-variable').addEventListener('click', () => {
      addVariable('node cluster');
      update();
    });
    list.addEventListener('change', update);
    list.addEventListener('click', e => {
      if (!e.target.classList.contains('aggregation-remove')) return;
      e.target.closest('li').remove();
      update();
    });
    sortable(list, { forcePlaceholderSize: true });
    list.addEventListener('sortupdate', update);

    MT.paneToggle($('.settings-toggle'), $('.left-pane'), false, { beside: $('.aggregation-grid'), resize: () => tables.forEach(table => table.redraw()) });

    const title = t => MT.titleize(t.dataset) + ' ' + MT.titleize(t.column);
    MT.tableExport(root, {
      'csv.zip': name => {
        const zip = new JSZip();
        data.forEach(t => zip.file(t.dataset + '_' + t.column + '.csv', Papa.unparse(t.data)));
        zip.generateAsync({ type: 'blob' }).then(content => MT.saveAs(content, name + '.zip'));
      },
      xlsx: name => {
        const workbook = XLSX.utils.book_new();
        // Sheet names must be unique and at most 31 characters
        data.forEach((t, i) => XLSX.utils.book_append_sheet(workbook, XLSX.utils.json_to_sheet(t.data), (i + 1) + ' ' + title(t).slice(0, 27)));
        XLSX.writeFile(workbook, name + '.xlsx');
      },
      pdf: name => MT.tablesPDF('Aggregation', data.map(t => ({
        headers: [title(t), `Number of ${MT.titleize(t.dataset)}s`, 'Percentage'],
        rows: t.data.map(row => [row[t.column] + '', row.n + '', row.percent])
      })), name),
      json: name => MT.saveAs(new Blob([JSON.stringify(data)], { type: 'application/json;charset=utf-8' }), name + '.json')
    });

    root.style.overflowY = 'scroll';

    addVariable('node cluster');
    update();
    const stop = ['link-visibility', 'node-visibility'].map(type => events.on(type, update));

    return {
      resize: () => tables.forEach(table => table.redraw()),
      destroy() {
        stop.forEach(fn => fn());
        sortable(list, 'destroy');
        tables.forEach(table => table.destroy());
      }
    };
  });
</script>
