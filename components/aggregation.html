<div class="table-sm aggregation-grid"></div>

<div class="view-controls">
  <button type="button" class="btn btn-light btn-sm settings-toggle" title="Aggregation Settings">
    <span class="bi bi-gear"></span>
  </button>
  <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#aggregation-export-modal" title="Export Aggregation data">
    <span class="bi bi-download"></span>
  </button>
</div>

<div class="left-pane">
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item active" role="presentation">
      <a href="#aggregation-settings" id="aggregation-tab" class="nav-link active" role="tab" data-bs-toggle="tab" aria-controls="aggregation-settings" aria-selected="true">
        Aggregation
      </a>
    </li>
  </ul>
  <div class="tab-content">
    <div id="aggregation-settings" class="tab-pane fade show active" role="tabpanel" aria-labelledby="aggregation-tab">
      <div class="form-group row" title="What data field would you like to aggregate on?">
        <div class="col-3">Tables</div>
        <div class="col-9">
          <ul class="aggregation-variables"></ul>
          <button type="button" class="btn btn-outline-primary btn-sm w-100 aggregation-add-variable">
            Add Variable
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="aggregation-export-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="false" aria-labelledby="aggregation-export-modal-title">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="aggregation-export-modal-title" class="modal-title h5">Export Aggregation</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group row">
          <div class="col-9">
            <input type="text" name="export-filename" aria-label="Filename" class="form-control form-control-sm" placeholder="Filename">
          </div>
          <div class="col-3">
            <select name="export-filetype" aria-label="Format" class="form-select form-select-sm">
              <option value="csv.zip" selected>CSV (zipped)</option>
              <option value="xlsx">Excel (XLSX)</option>
              <option value="pdf">PDF</option>
              <option value="json">JSON</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary export-button" data-bs-dismiss="modal">Export</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<script src="components/aggregation.js"></script>
